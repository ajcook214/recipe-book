<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Book tests</title>

    <!--
      The import map is what lets one test file serve both runners: Node
      resolves `node:test` natively, and here it resolves to a shim. No build
      step, no bundler, no install.
    -->
    <script type="importmap">
      {
        "imports": {
          "node:test": "./node-test.js",
          "node:assert": "./node-assert.js",
          "node:assert/strict": "./node-assert.js"
        }
      }
    </script>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main>
      <h1>Recipe Book tests</h1>
      <p class="sub">
        Same files as <code>npm test</code>, running in this browser through an
        import map. Serve this over <code>http://</code> &mdash; import maps do
        not work from <code>file://</code>. The adapter contract against real
        Google Drive needs a sign-in, so it has its own page:
        <a href="../drive/">test/drive/</a>.
      </p>
      <div id="summary">Running&hellip;</div>
      <div id="results"></div>
    </main>

    <script type="module">
      import { runSuites } from './runner.js';

      // Add new suites here. Pure modules run in both places; browser-only
      // suites guard themselves with { skip } so the Node run stays green.
      const SUITES = [
        '../merge.test.js',
        '../adapter-contract.test.js',
        '../drive-adapter.test.js',
        './env.test.js',
        './db.test.js',
        './sync.test.js',
      ];

      await runSuites(
        SUITES.map((path) => ({ name: path.replace(/^\.\.?\//, ''), load: () => import(path) })),
        {
          summary: /** @type {HTMLElement} */ (document.querySelector('#summary')),
          results: /** @type {HTMLElement} */ (document.querySelector('#results')),
        },
      );
    </script>
  </body>
</html>
